{% extends "base.html" %}
{% block title %}Sign in — Bikeshed{% endblock %}
{% block content %}
<section class="narrow card">
  <h1>Sign in</h1>
  <form method="post" action="/login" class="form">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" required autocomplete="email"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="primary" type="submit">Sign in</button>
  </form>
  <p class="muted">No account? <a href="/register">Register</a></p>
</section>
{% endblock %}
